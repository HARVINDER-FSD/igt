# Render.com Deployment Config
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend: Express + Nodemailer ──────────────────────────────────────────
  - type: web
    name: igt-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      # Set these in Render Dashboard → Environment (keep secrets safe!)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_EMAIL_RECEIVER
        sync: false
      - key: FRONTEND_URL
        sync: false   # e.g. https://igt-client.onrender.com

  # ── Frontend: React + Vite Static Site ────────────────────────────────────
  - type: web
    name: igt-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to your deployed server URL in Render Dashboard
      - key: VITE_API_URL
        sync: false   # e.g. https://igt-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
